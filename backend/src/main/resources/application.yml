spring:
  application:
    name: rsb-crm
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:rsbcrm}
    username: ${POSTGRES_USER:rsbcrm}
    password: ${POSTGRES_PASSWORD:rsbcrm}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      # Un serveur SMTP muet ne doit pas bloquer une requête indéfiniment
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 20000
      mail.smtp.writetimeout: 30000
      # Évitent une résolution DNS inverse de la machine (EHLO et Message-ID), lente selon le réseau
      mail.smtp.localhost: ${SMTP_HELO_HOST:localhost}
      mail.from: ${MAIL_FROM:crm@redseabunkering.com}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mvc:
    problemdetails:
      enabled: true
  jackson:
    time-zone: ${TZ:Africa/Djibouti}

server:
  port: 8080
  forward-headers-strategy: framework
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    mail:
      enabled: false

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

app:
  public-url: ${APP_PUBLIC_URL:http://localhost:8081}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8081}
  signup-requires-approval: ${APP_SIGNUP_REQUIRES_APPROVAL:true}
  seed-demo: ${APP_SEED_DEMO:false}
  mail-from: ${MAIL_FROM:crm@redseabunkering.com}
  auth:
    jwt-secret: ${JWT_SECRET:}
    access-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-ttl: ${JWT_REFRESH_TTL:P7D}
    cookie-secure: ${APP_COOKIE_SECURE:true}
    lock-duration: PT15M
    email-verification-ttl: PT24H
    password-reset-ttl: PT1H
    admin-email: ${APP_ADMIN_EMAIL:}
    admin-password: ${APP_ADMIN_PASSWORD:}

logging:
  level:
    root: INFO
    dj.redseabunkering: INFO
